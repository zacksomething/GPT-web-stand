name: Local records (Linux)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-records:
    name: Python ${{ matrix.python-version }} / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.13']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Record runtime
        run: |
          python --version
          python -c 'import platform; print(platform.platform()); print(platform.machine())'
          cat /etc/os-release
      - name: Test local records and process recovery
        run: python -B -m unittest discover -s tests -p 'test_task_record*.py' -v
